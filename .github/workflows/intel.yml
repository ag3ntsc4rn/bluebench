name: Intel data

# Refreshes the Intel tab's data (CISA KEV + FIRST EPSS) in Workers KV. Deploys nothing: code still
# reaches production only through merged PRs (ci.yml). Each run makes three KV writes (free tier: 1,000/day).
on:
  schedule:
    - cron: "15 14 * * *" # after EPSS publishes (~13:30 UTC daily)
    - cron: "15 22 * * 1-5" # after CISA's US-business-hours KEV updates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Exits non-zero without writing if KEV looks broken, so the stored data is never replaced by bad data.
      - name: Build KEV + EPSS data
        run: node apps/api/scripts/update-intel.ts "$RUNNER_TEMP/intel"
      # Keys must match KEV_KV_KEYS in packages/shared/src/intel.ts (a test checks this).
      - name: Store in KV
        run: |
          pnpm --filter @bluebench/api exec wrangler kv key put --binding VERDICTS --remote "intel:kev:all:v1" --path "$RUNNER_TEMP/intel/all.json"
          pnpm --filter @bluebench/api exec wrangler kv key put --binding VERDICTS --remote "intel:kev:recent:v1" --path "$RUNNER_TEMP/intel/recent.json"
          pnpm --filter @bluebench/api exec wrangler kv key put --binding VERDICTS --remote "intel:kev:vendors:v1" --path "$RUNNER_TEMP/intel/vendors.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
