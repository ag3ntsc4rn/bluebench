name: Intel data

# Refreshes the Intel tab's data (CISA KEV + FIRST EPSS) in Workers KV. Deploys nothing: code still
# reaches production only through merged PRs (ci.yml). Each run makes two KV writes (free tier: 1,000/day).
on:
  schedule:
    - cron: "15 14 * * *" # after EPSS publishes (~13:30 UTC daily)
    - cron: "15 22 * * 1-5" # after CISA's US-business-hours KEV updates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Exits non-zero without writing if KEV looks broken, so the stored data is never replaced by bad data.
      - name: Build KEV + EPSS data
        run: node apps/api/scripts/update-intel.ts "$RUNNER_TEMP/intel"
      # Keys must match KEV_KV_KEYS in packages/shared/src/intel.ts (a test checks this).
      - name: Store in KV
        run: |
          pnpm --filter @bluebench/api exec wrangler kv key put --binding VERDICTS --remote "intel:kev:all:v1" --path "$RUNNER_TEMP/intel/all.json"
          pnpm --filter @bluebench/api exec wrangler kv key put --binding VERDICTS --remote "intel:kev:recent:v1" --path "$RUNNER_TEMP/intel/recent.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
