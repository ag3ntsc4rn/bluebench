packages:
  - apps/*
  - packages/*

# Only these dependencies may run install scripts (native binaries).
allowBuilds:
  esbuild: true
  workerd: true

# Security fixes for transitive build/test-time dependencies (Dependabot alerts), until the
# packages that pull them in update. None of these end up in the Worker or the site bundle.
# Remove an entry once `pnpm why` shows the parent depends on a fixed version itself.
overrides:
  "ajv>fast-uri": ^3.1.9                          # GHSA-w74x-v6f9-j3xg and 3 others (workbox-build)
  "@rollup/plugin-terser>serialize-javascript": ^7.1.3  # GHSA-m5mm-p8h7-m29v (workbox-build)
  "workbox-build>glob": ^14.0.2                   # GHSA-3g3m-2fjr-6pw4; brings minimatch 11 (GHSA-g3hv-75wg-m249)
  "@esbuild-kit/core-utils>esbuild": ^0.25.0      # GHSA-67mh-4wv8-2f99 (drizzle-kit)
